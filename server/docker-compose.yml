# Local, always-on AirPay server: restarts itself, keeps its database across restarts.
#   docker compose up -d --build        start
#   docker compose logs -f              watch
#   docker compose down                 stop (data stays in the volume)
services:
  duffle:
    build: .
    ports:
      - "8787:8787"
    # Supplier keys, RPC and Firebase project id, from the gitignored .env.
    env_file: ../.env
    environment:
      DUFFLE_DB: /data/duffle.db
      # The key is mounted, never copied into the image, so the image is safe to push anywhere.
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/fcm.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Set when the server sits behind a tunnel or proxy, so each caller has their own rate limit.
      TRUST_PROXY: ${TRUST_PROXY:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
    volumes:
      - duffle-data:/data
      # Path to your Firebase service-account JSON, set as FCM_KEY_FILE in server/.env (gitignored).
      - ${FCM_KEY_FILE:?set FCM_KEY_FILE in server/.env to your Firebase service-account JSON}:/secrets/fcm.json:ro
    # No extra Linux powers, no writes outside the data volume.
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  duffle-data:
