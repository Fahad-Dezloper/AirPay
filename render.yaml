# AirPay on Render: one service, the server (public, at api.airpayy.com).
# Create it from the Render dashboard: New > Blueprint > this repository.
#
# Secrets are never in this file. Values marked `sync: false` are asked for once, when the
# Blueprint is created. The Firebase key is added afterwards as a Render "Secret File"
# (Environment > Secret Files), which Render mounts under /etc/secrets/:
#
#   airpay-server:  fcm.json (Firebase service account)
#

services:
  - type: web
    name: airpay-server
    runtime: docker
    rootDir: server
    # With rootDir set, Render reads these two paths from inside that folder.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: airpay-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DUFFLE_DB
        value: /data/duffle.db
      - key: PUBLIC_URL
        value: https://api.airpayy.com
      # Behind Render's proxy every caller looks the same; use the forwarded address instead.
      - key: TRUST_PROXY
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/fcm.json
      - key: FCM_PROJECT_ID
        sync: false
      - key: BITREFILL_API_KEY
        sync: false
      # AirPay recharges: Cryptorefills partner keys (the second is the 401 failover).
      - key: CRYPTOREFILL_API
        sync: false
      - key: CRYPTOREFILL_API_2
        sync: false
      # Support emails to the inbox: a Gmail address and its APP password (not the login).
      - key: SUPPORT_SMTP_USER
        sync: false
      - key: SUPPORT_SMTP_PASSWORD
        sync: false
      - key: SUPPORT_TO
        value: airpayhq@gmail.com
      - key: DUFFLE_RPC_URL
        sync: false
      - key: DUFFLE_MAINNET_RPC
        sync: false
      - key: DUFFLE_ADMIN_TOKEN
        sync: false
